name: Resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'content/*.html'
      - 'resume/**'
      - 'public/fonts/**'
      - scripts/build-resume.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  build:
    name: Build résumé PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the PDF date comes from the last commit touching the résumé sources.
          fetch-depth: 0
          # Don't leave the write token in .git/config where npm packages could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pdfjs-dist v6 (resume:check) needs Promise.withResolvers (Node 22+).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build PDFs
        run: npm run resume:build

      - name: Check PDF text (ATS readability)
        run: npm run resume:check

      # Pushes made with GITHUB_TOKEN don't trigger workflows, and the PDF isn't in `paths`, so this can't loop.
      - name: Commit PDFs if changed
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # --porcelain also reports a brand-new (untracked) PDF, which git diff would miss.
          if [ -z "$(git status --porcelain -- public/CV/MGavrilovCV.pdf public/CV/MGavrilovCV-ATS.pdf)" ]; then
            echo "PDFs unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/CV/MGavrilovCV.pdf public/CV/MGavrilovCV-ATS.pdf
          git commit -m "chore(resume): regenerate PDFs"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
