name: Resume PDF

on:
  push:
    branches: [main]
    paths:
      - content/resume.html
      - 'resume/**'
      - 'public/fonts/**'
      - scripts/build-resume.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  build:
    name: Build résumé PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the PDF date comes from the last commit touching the résumé sources.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build PDF
        run: npm run resume:build

      # Pushes made with GITHUB_TOKEN don't trigger workflows, and the PDF isn't in `paths`, so this can't loop.
      - name: Commit PDF if changed
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/CV/MGavrilovCV.pdf; then
            echo "PDF unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/CV/MGavrilovCV.pdf
          git commit -m "chore(resume): regenerate PDF"
          git pull --rebase origin main
          git push origin HEAD:main
